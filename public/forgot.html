<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Techsum Monitor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e2e8f0 0%, #f8fafc 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px;
        }
        .brand-logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .btn-primary {
            background-color: #4f46e5;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background-color: #4338ca;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
    </style>
</head>

<body>

<div class="card">
    <div class="text-center">
        <img src="TechSum_logo.png" alt="Techsum Logo" class="brand-logo">
        <h4 class="fw-bold">Reset Access</h4>
        <p class="text-muted small mb-4">
            Enter your email and we'll send you a link to reset your password.
        </p>
    </div>

    <!-- ?? Forgot Password Form -->
    <form id="forgotForm">
        <div class="mb-3 text-start">
            <label class="form-label small fw-bold text-secondary">Email Address</label>
            <input
                id="email"
                name="email"
                type="email"
                class="form-control"
                placeholder="name@techsum.com"
                required
            >
        </div>

        <button id="submitBtn" type="submit" class="btn btn-primary w-100">
            Send Reset Link
        </button>

        <div id="msg" class="text-center mt-3 small"></div>

        <div class="text-center mt-3">
            <a href="/login" class="text-decoration-none small text-secondary">
                Back to Login
            </a>
        </div>
    </form>
</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");

    msg.innerText = "";
    btn.disabled = true;
    btn.innerText = "Sending...";

    try {
        const res = await fetch("/api/v1/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok) {
            msg.innerHTML = `<span class="text-success">
                If the email exists, a reset link has been sent.
            </span>`;
        } else {
            msg.innerHTML = `<span class="text-danger">
                ${data.detail || "Something went wrong"}
            </span>`;
        }
    } catch (err) {
        msg.innerHTML = `<span class="text-danger">
            Server unreachable. Try again later.
        </span>`;
    }

    btn.disabled = false;
    btn.innerText = "Send Reset Link";
});
</script>

</body>
</html>
