<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Techsum Monitor</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e2e8f0 0%, #f8fafc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        /* Updated Logo Container for Branding */
        .logo-container {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            max-width: 180px; /* Adjust based on your logo shape */
            height: auto;
            margin-bottom: 15px;
        }

        h3 {
            margin: 0 0 8px 0;
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
            font-size: 1rem;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #error {
            margin-top: 16px;
            font-size: 0.85rem;
            min-height: 1.2rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-container">
        <img src="TechSum_logo.png" alt="Techsum Monitor Logo" class="brand-logo">
        <h3>Techsum Monitor</h3>
    </div>
    
    <p class="subtitle">Secure Enterprise Portal Access</p>

    <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@techsumsolution.com">
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button id="loginBtn" onclick="login()">Sign In</button>
     <br>
     <br>
    <div class="text-end mb-3">
    <a href="/forgot" style="font-size: 0.8rem; color: #64748b; text-decoration: none;">Forgot Password?</a>
    </div> 

    <p id="error"></p>
</div>

<script>
// Auto-redirect if already logged in (using Clean URL path)
if (localStorage.getItem("token")) {
    window.location.href = "/";
}

async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("error");
    const btn = document.getElementById("loginBtn");

    if (!email || !password) {
        errorEl.style.color = "#ef4444";
        errorEl.innerText = "Credentials required";
        return;
    }

    errorEl.innerText = "";
    btn.disabled = true;
    btn.innerText = "Authenticating...";

    try {
        const response = await fetch('/api/v1/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });

        const data = await response.json();

        if (response.ok && data.access_token) {
            localStorage.setItem("token", data.access_token);
            // Redirect using Clean URL
            window.location.href = "/";
        } else {
            errorEl.style.color = "#ef4444";
            errorEl.innerText = data.message || "Invalid credentials provided";
            btn.disabled = false;
            btn.innerText = "Sign In";
        }
    } catch (err) {
        errorEl.style.color = "#ef4444";
        errorEl.innerText = "Infrastructure unavailable. Try again.";
        btn.disabled = false;
        btn.innerText = "Sign In";
    }
}

document.addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });

// Security: Disable Inspections
document.addEventListener('contextmenu', event => event.preventDefault());
document.onkeydown = function(e) {
    if (e.keyCode == 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
        (e.ctrlKey && e.keyCode == 85)) {
        return false;
    }
};
</script>
</body>
</html>
